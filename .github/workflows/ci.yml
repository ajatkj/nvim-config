name: Neovim configuration checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Neovim and Lua tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes neovim lua5.4

      - name: Check Lua syntax
        run: |
          find . -type f -name '*.lua' -not -path './.git/*' -print0 \
            | xargs -0 -n1 luac5.4 -p

      - name: Prepare Neovim runtime directory
        run: |
          mkdir -p "$RUNNER_TEMP/nvim-runtime"
          chmod 700 "$RUNNER_TEMP/nvim-runtime"

      - name: Install configured plugins
        env:
          XDG_CONFIG_HOME: ${{ github.workspace }}/.ci-xdg
          XDG_RUNTIME_DIR: ${{ runner.temp }}/nvim-runtime
          NVIM_APPNAME: nvim
        run: nvim --headless -u init.lua "+Lazy! sync" +qa

      - name: Start Neovim without startup errors
        env:
          XDG_CONFIG_HOME: ${{ github.workspace }}/.ci-xdg
          XDG_RUNTIME_DIR: ${{ runner.temp }}/nvim-runtime
          NVIM_APPNAME: nvim
        run: nvim --headless -u init.lua "+qa"
